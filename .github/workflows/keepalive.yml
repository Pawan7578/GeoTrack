name: Keep Backend Alive

on:
  schedule:
    # Runs every 14 minutes — Render sleeps after 15 min of inactivity
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -f https://geotrack-jseb.onrender.com/api/health
          echo "Backend is alive"
